# MARCIUS3R — configuración central
# Las claves secretas NUNCA van aquí: van en ~/.marcius3r/secrets.env (permisos 600).

channel:
  name: MARCIUS3R
  language: es-ES
  timezone: Europe/Madrid
  cta: "¿Tú qué opinas? Déjamelo en comentarios y suscríbete a MARCIUS3R para descubrir más secretos de GTA 6."

brand:
  colors:
    black: "#05040A"
    neon_purple: "#B026FF"
    electric_blue: "#00B3FF"
    white: "#FFFFFF"
  font: "assets/fonts/Montserrat-ExtraBold.ttf"   # se descarga con `marcius3r setup`; fallback DejaVu

formats:
  short:
    width: 1080
    height: 1920
    fps: 30
    min_seconds: 25
    max_seconds: 59          # < 60 s para máxima compatibilidad Shorts
    target_seconds: 42
    clip_seconds: 5
    subtitle_style: big      # palabra a palabra, grande, centro-bajo
  long:
    width: 1920
    height: 1080
    fps: 30
    min_seconds: 300
    max_seconds: 660
    target_seconds: 480
    clip_seconds: 8
    subtitle_style: classic

production:
  daily_shorts: 1
  long_every_n_days: 7       # 1 vídeo largo semanal al principio
  require_manual_approval: true   # ← se pone a false SOLO cuando apruebes la muestra
  max_credits_per_short: 60
  max_credits_per_long: 450
  monthly_budget_credits: 1500
  dry_run: false

providers:
  script:
    engine: anthropic         # anthropic | template
    model: claude-opus-5-5
    effort: high
  # Motor local GRATUITO de Open-Generative-AI (https://github.com/deepbeepmeep/Wan2GP)
  wan2gp:
    path: ~/Wan2GP             # carpeta donde clonaste Wan2GP (con su venv)
    python: null               # por defecto <path>/venv/bin/python
    profile: 4                 # 4 = poca VRAM (8-12 GB); 3 = más rápido con 16-24 GB
    attention: null            # p.ej. sage2 si lo instalaste
  kaggle:                      # misma generación en la GPU gratuita de Kaggle (sin GPU propia)
    machine_shape: NvidiaTeslaT4
    profile: 4
    timeout_minutes: 170
  voice:
    order: [external, wan2gp, voicestudio, kaggle, elevenlabs]
    wan2gp:
      language: spanish
      # Recomendado: 3-10 s de TU voz en castellano, limpia (WAV). Con referencia → acento de España fiable.
      reference_audio: library/voice/marcius3r_ref.wav
      reference_transcript: ""          # vacío = Wan2GP la transcribe con Whisper
      voice_tags: "male, young adult, moderate pitch"   # si no hay referencia (acento no garantizado)
      steps: 32
    voicestudio:
      url: http://127.0.0.1:3900
      model: omnivoice
      voice: "marcius3r-es"
      instructions: "Hombre joven, español de España (castellano peninsular), creador de contenido gaming, enérgico, cercano, pausas naturales."
      speed: 1.05
    elevenlabs:
      voice_id: ""
      model_id: eleven_multilingual_v2
  video:
    # gameplay propio > Wan2GP local > Kaggle GPU gratis > clips generados fuera (manifest)
    # muapi = nube de Open-Generative-AI (DE PAGO): añádela al final solo si la quieres.
    order: [gameplay_library, wan2gp, kaggle, external]
    gameplay_library:
      path: library/gameplay
    wan2gp:
      model: ltx2_25_22B_distilled   # vídeo+sonido 720p, 8 pasos. Ligero: t2v_1.3B (480p, 8 GB)
    muapi:
      base_url: https://api.muapi.ai
      endpoint: seedance-2.5-t2v
      resolution: 720p
  music:
    library: library/music
    order: [wan2gp, kaggle]          # ACE-Step 1.5 (Apache-2.0), instrumental original
    style: "dark cinematic synthwave trap, 80s tropical neon, punchy drums, deep 808 bass, no vocals"
  sfx:
    library: library/sfx

qc:
  max_freeze_ratio: 0.12      # % de tiempo con imagen congelada (detecta "fotos")
  max_black_seconds: 0.6
  target_lufs: -14
  lufs_tolerance: 2.0
  max_wer: 0.18               # error de transcripción voz vs guion
  min_scene_changes_per_10s: 2

schedule:
  # Franjas de prueba (hora Madrid). Se rotan y se aprende con Analytics.
  slots:
    A: "20:00"   # prime time España
    B: "23:30"   # compromiso ES noche / LATAM tarde
    C: "03:00"   # prime time México/Colombia (publicación programada)
  exploration_rate: 0.25
  min_samples_per_slot: 5

research:
  max_age_hours: 72
  feeds:
    - {name: "Google News ES", url: "https://news.google.com/rss/search?q=%22GTA+6%22+OR+%22GTA+VI%22+when:2d&hl=es&gl=ES&ceid=ES:es", tier: prensa}
    - {name: "Google News MX", url: "https://news.google.com/rss/search?q=%22GTA+6%22+OR+%22GTA+VI%22+when:2d&hl=es-419&gl=MX&ceid=MX:es-419", tier: prensa}
    - {name: "Google News EN", url: "https://news.google.com/rss/search?q=%22GTA+6%22+OR+%22GTA+VI%22+when:2d&hl=en-US&gl=US&ceid=US:en", tier: prensa}
    - {name: "Rockstar Newswire", url: "https://www.rockstargames.com/newswire", tier: oficial, kind: html}
    - {name: "r/GTA6", url: "https://www.reddit.com/r/GTA6/top.json?t=day&limit=40", tier: comunidad, kind: reddit}
  official_domains: [rockstargames.com, take2games.com, support.rockstargames.com]
  rumor_markers: [leak, filtra, rumor, rumour, insider, supuest, alleged, reportedly, según fuentes]
