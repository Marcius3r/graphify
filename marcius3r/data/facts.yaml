facts:
  - id: release_date
    text: "GTA 6 sale el 19 de noviembre de 2026 en PS5 y Xbox Series X|S."
    status: oficial
    sources: ["https://store.rockstargames.com/game/buy-gta-vi", "https://www.forbes.com/sites/erikkain/2026/11/16/gta-6-release-date-time-ps5-xbox-series-x-download-size-day-one-update/"]
    verified_live: false
  - id: preload
    text: "La precarga digital está disponible desde el 10 de noviembre de 2026."
    status: oficial
    sources: ["https://store.rockstargames.com/game/buy-gta-vi"]
    verified_live: false
  - id: physical_code
    text: "La edición física incluye un código de descarga, no un disco con el juego."
    status: oficial
    sources: ["https://store.rockstargames.com/game/buy-gta-vi"]
    verified_live: false
  - id: delays
    text: "El juego se retrasó de 2025 al 26 de mayo de 2026 y después al 19 de noviembre de 2026."
