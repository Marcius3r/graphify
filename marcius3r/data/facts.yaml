    status: prensa_oficial
    sources: ["https://variety.com/2026/gaming/news/gta-6-preorders-expectations-launch-1236943278/"]
    verified_live: false
  - id: gta5_release
    text: "GTA 5 salió el 17 de septiembre de 2013, así que entre GTA 5 y GTA 6 pasan más de trece años."
