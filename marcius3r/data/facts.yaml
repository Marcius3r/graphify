    sources: ["https://www.rockstargames.com/gta-v", "https://es.wikipedia.org/wiki/Grand_Theft_Auto_V"]
    verified_live: false

# Cosas que NO se deben presentar como hechos
caution:
  - "Material filtrado (p.ej. 'Cyberleek'): no se muestra, no se describe como real. Take-Two ha enviado DMCA."
  - "Fecha de GTA Online 2027: rumor."
  - "Tamaño de 212 GB: una sola fuente; decir 'según algunos medios'."
  - "Precios en euros: varían según tienda; no afirmar una cifra única."
  - "«80 horas de historia»: era la partida de un desarrollador incluyendo secundarias; no presentarlo como duración oficial."
  - "«Truco de Nueva Zelanda» para jugar antes: no garantizado; no recomendarlo."
  - "Reseñas el 18/11 y GTA Online en 2027: rumores."
  - "Clips virales de GTA 6 hechos con IA: no usarlos ni presentarlos como reales."
