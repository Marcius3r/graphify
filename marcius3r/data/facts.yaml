    sources: ["https://geekculture.co/rockstar-releases-second-grand-theft-auto-vi-trailer-reveals-6-major-in-game-locations-following-delay"]
    verified_live: false
  - id: protagonists
    text: "Los protagonistas son Jason Duval y Lucia Caminos."
