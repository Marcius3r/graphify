<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chapita Admin</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#234536">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chapita Admin">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/admin/manifest.webmanifest">
<link rel="apple-touch-icon" href="/admin/apple-touch-icon.png">
<link rel="icon" href="/admin/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#eceeea; --panel:#e2e5df; --paper:#f8f9f6; --ink:#23272b; --slate:#5d6267; --line:#d5d8d2;
  --green:#234536; --green-ink:#fff; --warn:#9a5b12; --warn-bg:#f6ead6; --bad:#a3392f; --bad-bg:#f6dedb; --ok:#2f6b47; --ok-bg:#dcefe2;
  --display:'Italiana','Didot',Georgia,serif; --text:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){:root{
  --ground:#14171a; --panel:#1c2024; --paper:#191d20; --ink:#e8eae6; --slate:#a2a8ab; --line:#2c3135;
  --green:#7fae94; --green-ink:#10241a; --warn:#e3a85c; --warn-bg:#3a2c18; --bad:#e58a80; --bad-bg:#3b1f1c; --ok:#8fd0a5; --ok-bg:#1c3326; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.5 var(--text);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.05}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;border:0;background:var(--green);color:var(--green-ink);font-weight:600;cursor:pointer}
.btn.big{min-height:58px;font-size:17px;width:100%}
.btn.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn:disabled{opacity:.55;cursor:default}
.field{display:grid;gap:6px}
.field label{font-size:14px;font-weight:600}
.field input,.field textarea,.field select,.inp{width:100%;min-width:0;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--paper)}
.muted{color:var(--slate)}
.small{font-size:13px}
.err{color:var(--bad);font-size:14px;min-height:1.3em}

/* login */
.login{min-height:100%;display:grid;place-items:center;padding:24px}
.login-card{width:min(420px,100%);display:grid;gap:16px;background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:28px}
.login-card h1{font-size:42px}
.brandmark{width:56px;height:56px;border-radius:16px}

/* layout */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;padding:28px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;background:var(--paper)}
.side h1{font-size:30px;margin:0 8px 18px}
.nav-b{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:0;background:transparent;cursor:pointer;text-align:left;font-weight:500;color:var(--slate);position:relative}
.nav-b svg{width:22px;height:22px;flex:none}
.nav-b[aria-current="page"]{background:var(--ground);color:var(--ink)}
.dot{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:12px;font-weight:600;display:inline-grid;place-items:center;margin-left:auto}
.main{min-width:0;padding:28px 32px 40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
.top h2{font-size:38px}
.bottom{display:none}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .main{padding:calc(16px + var(--safe-t)) 16px calc(96px + var(--safe-b))}
  .top h2{font-size:32px}
  .bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--safe-b))}
  .bottom .nav-b{flex-direction:column;gap:3px;padding:8px 2px;font-size:11px;justify-content:center}
  .bottom .dot{position:absolute;top:2px;right:calc(50% - 22px);margin:0;min-width:18px;height:18px;font-size:11px}
}

/* tarjetas resumen */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:26px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;text-align:left}
.stat b{display:block;font:600 34px/1 var(--text);font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--slate)}
.stat.alert{border-color:var(--bad)}
.sec-t{font-size:15px;font-weight:600;margin:24px 0 10px;display:flex;justify-content:space-between;align-items:center}
.notif{display:grid;gap:8px}
.notif div{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px}
.notif div.new{border-left:4px solid var(--green)}
.notif time{display:block;font-size:12px;color:var(--slate)}

/* pedidos */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.toolbar .inp{flex:1;min-width:200px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.orders{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.oc{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;grid-template-columns:64px 1fr;gap:14px;cursor:pointer;text-align:left;width:100%;min-width:0}
.oc canvas{width:64px;height:64px}
.oc h3{font-family:var(--text);font-weight:600;font-size:16px}
.oc p{margin:2px 0 0;font-size:14px;color:var(--slate);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--panel);color:var(--ink);margin-top:6px}
.badge.pago{background:var(--warn-bg);color:var(--warn)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.empty{padding:40px 16px;text-align:center;color:var(--slate);background:var(--paper);border:1px dashed var(--line);border-radius:18px}

/* ficha */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(10,14,12,.45);display:flex;justify-content:flex-end}
.sheet-in{width:min(560px,100%);height:100%;overflow-y:auto;background:var(--ground);padding:calc(18px + var(--safe-t)) 20px calc(28px + var(--safe-b));display:grid;gap:16px;align-content:start}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-h h2{font-size:34px}
.x{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--paper);font-size:22px;cursor:pointer}
.design{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--panel);border-radius:18px;padding:14px}
.design figure{margin:0;text-align:center;font-size:12px;color:var(--slate)}
.design canvas{width:100%;height:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;font-size:15px}
.kv dt{color:var(--slate)}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.paybox{background:var(--paper);border:2px solid var(--green);border-radius:18px;padding:16px;display:grid;gap:12px}
.paybox .concept{font:600 24px/1.25 var(--text);font-variant-numeric:tabular-nums}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hist{display:grid;gap:6px;font-size:13px}
.hist div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:6px 0}

/* whatsapp */
.inbox{display:grid;grid-template-columns:320px 1fr;gap:14px;min-height:60vh}
.convs{display:grid;gap:8px;align-content:start}
.cv{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 14px;text-align:left;cursor:pointer;width:100%;min-width:0}
.cv[aria-current="true"]{border-color:var(--ink)}
.cv b{display:flex;justify-content:space-between;gap:8px}
.cv p{margin:2px 0 0;font-size:14px;color:var(--slate);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat{background:var(--paper);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;min-height:60vh;min-width:0}
.chat-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}
.log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:82%;padding:10px 13px;border-radius:16px;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.bub.in{background:var(--panel);align-self:flex-start;border-bottom-left-radius:5px}
.bub.out{background:var(--green);color:var(--green-ink);align-self:flex-end;border-bottom-right-radius:5px}
.bub time{display:block;font-size:11px;opacity:.7;margin-top:3px}
.compose{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.compose textarea{flex:1;min-width:0;resize:none;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--ground);min-height:48px;max-height:140px}
@media (max-width:820px){.inbox{grid-template-columns:1fr}.inbox.open .convs{display:none}.inbox:not(.open) .chat{display:none}}

/* chat IA */
.ia{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:18px;min-height:65vh}
.sug{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 12px}
.sug button{border:1px solid var(--line);background:var(--ground);border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer}
.prop{align-self:flex-start;display:grid;gap:8px;background:var(--warn-bg);border-radius:14px;padding:12px;max-width:90%}
.prop b{color:var(--warn)}

/* ajustes */
.setgrid{display:grid;gap:12px;max-width:760px}
.setrow{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.setrow code{font-size:13px;background:var(--ground);padding:4px 8px;border-radius:6px;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--ground);padding:12px 18px;border-radius:12px;font-size:15px;max-width:calc(100% - 32px)}
dialog{border:0;border-radius:20px;padding:0;width:min(440px,calc(100% - 32px));background:var(--paper);color:var(--ink)}
dialog::backdrop{background:rgba(10,14,12,.5)}
.dlg{padding:22px;display:grid;gap:14px}
.dlg h3{font-size:30px}
</style>
</head>
<body>

<!-- Acceso -->
<section class="login" id="vLogin" hidden>
  <form class="login-card" id="fLogin">
    <img class="brandmark" src="/admin/icon-192.png" alt="">
    <h1>Chapita Admin</h1>
    <p class="muted">Acceso privado del administrador.</p>
    <div class="field"><label for="lEmail">Correo</label><input id="lEmail" type="email" autocomplete="username" required></div>
    <div class="field"><label for="lPass">Contraseña</label><input id="lPass" type="password" autocomplete="current-password" minlength="10" required></div>
    <p class="err" id="lErr" aria-live="polite"></p>
    <button class="btn big" type="submit" id="lBtn">Entrar</button>
    <button class="btn ghost" type="button" id="lSignup">Crear mi cuenta de administrador</button>
    <p class="muted small">La primera vez, crea tu cuenta con tu correo de administrador y una contraseña de al menos 10 caracteres. Te llegará un correo para confirmarla.</p>
  </form>
</section>

<!-- Aplicación -->
<div class="app" id="vApp" hidden>
  <aside class="side" aria-label="Secciones">
    <h1>Chapita</h1>
    <nav id="navSide"></nav>
    <div style="margin-top:auto" class="muted small" id="whoSide"></div>
  </aside>
  <main class="main">
    <div class="top"><h2 id="title">Inicio</h2><button class="btn ghost" id="btnRefresh" type="button" aria-label="Actualizar">Actualizar</button></div>

    <section id="tInicio">
      <div class="stats" id="stats"></div>
      <div class="sec-t"><span>Avisos</span><button class="btn ghost" type="button" id="btnReadNotif" style="min-height:38px">Marcar como leídos</button></div>
      <div class="notif" id="notifs"></div>
    </section>

    <section id="tPedidos" hidden>
      <div class="toolbar"><input class="inp" id="q" type="search" placeholder="Buscar por pedido, cliente, mascota o teléfono" aria-label="Buscar pedidos"></div>
      <div class="chips" id="chips"></div>
      <div class="orders" id="orders"></div>
    </section>

    <section id="tWhatsApp" hidden>
      <div class="inbox" id="inbox">
        <div class="convs" id="convs"></div>
        <div class="chat">
          <div class="chat-h"><div><b id="chName"></b><div class="muted small" id="chSub"></div></div><button class="btn ghost" type="button" id="chBack" style="min-height:40px">Volver</button></div>
          <div class="log" id="chLog"></div>
          <div class="sug" id="chAi"><button type="button" id="chSuggest">Proponer una respuesta</button></div>
          <form class="compose" id="chForm"><textarea id="chText" rows="1" placeholder="Escribe tu respuesta" aria-label="Respuesta"></textarea><button class="btn" type="submit">Enviar</button></form>
        </div>
      </div>
    </section>

    <section id="tIA" hidden>
      <div class="ia">
        <div class="log" id="iaLog"></div>
        <div class="sug" id="iaSug">
          <button type="button">Enséñame los pedidos pendientes de pago</button>
          <button type="button">¿Cuántas reservas hemos recibido esta semana?</button>
          <button type="button">Busca el pedido de Toby</button>
        </div>
        <form class="compose" id="iaForm"><textarea id="iaText" rows="1" placeholder="Escribe una orden" aria-label="Orden para el asistente"></textarea><button class="btn" type="submit" id="iaBtn">Enviar</button></form>
      </div>
    </section>

    <section id="tAjustes" hidden>
      <div class="setgrid" id="settings"></div>
    </section>
  </main>
  <nav class="bottom" id="navBottom" aria-label="Secciones"></nav>
</div>

<!-- Ficha de pedido -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet-in" role="dialog" aria-modal="true" aria-labelledby="shTitle">
    <div class="sheet-h"><h2 id="shTitle"></h2><button class="x" type="button" id="shClose" aria-label="Cerrar">×</button></div>
    <div id="shBody"></div>
  </div>
</div>

<dialog id="dlg"><form class="dlg" method="dialog" id="dlgForm"><h3 id="dlgT"></h3><div id="dlgB"></div><div class="acts"><button class="btn ghost" value="no" type="submit">Cancelar</button><button class="btn" value="si" type="submit" id="dlgOk">Confirmar</button></div></form></dialog>
<div class="toast" id="toast" hidden role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script>
const SUPA_URL = "https://zmosqfoiddndrlieuleb.supabase.co";
const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inptb3NxZm9pZGRuZHJsaWV1bGViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUwNTY0MjAsImV4cCI6MjExMDYzMjQyMH0.T1b2b4iTGdyH4bK8I9MOIIJ1kyk1ApwQ4Q1FxVlZ_9I"; // clave pública: no da acceso a nada sin sesión de administrador
const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const eur = (c) => (c / 100).toLocaleString("es-ES", { minimumFractionDigits: 2 }) + " €";
const fecha = (d) => d ? new Date(d).toLocaleString("es-ES", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "—";
const COLORS = { onix:["negro","#141414"], marfil:["blanco","#f5f5f0"], burdeos:["rojo","#e3001b"], terracota:["naranja","#ff6b00"], arena:["amarillo","#ffcc00"], salvia:["verde lima","#8ac926"], ingles:["verde","#00a352"], piedra:["turquesa","#00b8b0"], chocolate:["azul cielo","#2ea8ff"], marino:["azul eléctrico","#1446ff"], lavanda:["morado","#8a2be2"], rosa:["rosa","#ff3d8b"] };
const cName = (k) => COLORS[k]?.[0] ?? k;

const badgeCls = (o) => ["rechazado","cancelado","incidencia"].includes(o.estado) ? "bad" : ["pago_confirmado","completado","enviado"].includes(o.estado) ? "ok" : "";

let ORDERS = [], MSGS = [], NOTIFS = [], ADMIN = "", filtro = "todos", convSel = null;

// ---------- toast / diálogo ----------
let toastT; function toast(t) { $("toast").textContent = t; $("toast").hidden = false; clearTimeout(toastT); toastT = setTimeout(() => $("toast").hidden = true, 3200); }
function confirmar(titulo, html, ok = "Confirmar") {
  return new Promise((res) => { $("dlgT").textContent = titulo; $("dlgB").innerHTML = html; $("dlgOk").textContent = ok;
    const d = $("dlg"); d.returnValue = ""; d.showModal(); d.addEventListener("close", () => res(d.returnValue === "si"), { once: true }); });
}

// ---------- API privada ----------
async function api(accion, datos = {}) {
  const { data, error } = await sb.functions.invoke("admin-api", { body: { accion, ...datos } });
  if (error) { let m = error.message; try { m = (await error.context.json()).error || m; } catch {} throw new Error(m); }
  return data;
}

// ---------- recoloreado de la chapa real (mismo motor que la web) ----------
const toLin = new Float32Array(256); for (let i = 0; i < 256; i++) { const c = i / 255; toLin[i] = c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
const LUTN = 4096, fromLin = new Uint8ClampedArray(LUTN + 1); for (let i = 0; i <= LUTN; i++) { const c = i / LUTN; fromLin[i] = Math.round(255 * (c <= 0.0031308 ? c * 12.92 : 1.055 * Math.pow(c, 1 / 2.4) - 0.055)); }
const shPow = new Float32Array(256); for (let i = 0; i < 256; i++) shPow[i] = Math.pow(i / 127.5, 1.6);
const hexLin = (h) => [1, 3, 5].map((i) => toLin[parseInt(h.slice(i, i + 2), 16)]);
const SRC = {};
const loadZ = (n) => new Promise((r) => { const im = new Image(); im.onload = () => { const c = document.createElement("canvas"); c.width = im.naturalWidth; c.height = im.naturalHeight; const g = c.getContext("2d"); g.drawImage(im, 0, 0); SRC[n] = g.getImageData(0, 0, c.width, c.height); r(); }; im.onerror = r; im.src = `/img/zonas-${n}.webp`; });
const zonesReady = Promise.all([loadZ("huella"), loadZ("nfc")]);
function paint(cv, model, a, b, size) {
  const z = SRC[model]; if (!z || !COLORS[a] || !COLORS[b]) return;
  const tmp = document.createElement("canvas"); tmp.width = z.width; tmp.height = z.height;
  const g = tmp.getContext("2d"), out = g.createImageData(z.width, z.height), d = z.data, o = out.data;
  const A = hexLin(COLORS[a][1]), B = hexLin(COLORS[b][1]);
  const [Bo, Fo, Di] = model === "huella" ? [A, B, A] : [A, A, B];
  for (let i = 0; i < d.length; i += 4) { const al = d[i + 3]; if (!al) { o[i + 3] = 0; continue; }
    const wb = d[i] / 255, wd = d[i + 1] / 255, wf = Math.max(0, 1 - wb - wd), sh = shPow[d[i + 2]];
    for (let k = 0; k < 3; k++) o[i + k] = fromLin[Math.min(LUTN, ((wb * Bo[k] + wd * Di[k] + wf * Fo[k]) * sh * LUTN) | 0)];
    o[i + 3] = al; }
  g.putImageData(out, 0, 0);

function resumen(desde, etiqueta) {
  const l = ORDERS.filter((o) => !desde || new Date(o.created_at) >= desde);
  const pag = l.filter((o) => o.pago === "pagado"), pend = l.filter((o) => o.pago !== "pagado" && activo(o));
  const sum = (a) => a.reduce((s, o) => s + (o.importe_cents || 0), 0), uds = (a) => a.reduce((s, o) => s + (o.unidades || 0), 0);
  iaBubble("in", `<b>${esc(etiqueta)}</b><br>Reservas: ${l.length} (${uds(l)} chapas)<br>Cobrado: ${eur(sum(pag))} en ${pag.length} pedidos<br>Pendiente de cobro: ${eur(sum(pend))} en ${pend.length} pedidos<br>Cancelados o rechazados: ${l.filter((o) => !activo(o)).length}`);
}
function buscarRef(t) { const m = t.match(/ch[-\s]?(\d{4})/i); return m ? ORDERS.find((o) => o.ref.toUpperCase() === "CH-" + m[1]) : null; }
function propuesta(texto, fn, ok) {
  const box = document.createElement("div"); box.className = "prop";
  box.innerHTML = `<b>Necesita tu confirmación</b><span>${texto}</span><div class="acts"><button class="btn ghost" type="button">Descartar</button><button class="btn" type="button">Confirmar</button></div>`;
  const [no, si] = box.querySelectorAll("button");
  no.onclick = () => box.remove();
  si.onclick = async () => { si.disabled = true; try { await fn(); box.innerHTML = `<b>Hecho</b><span>${esc(ok)}</span>`; loadAll(); } catch (e) { toast("No se pudo: " + e.message); si.disabled = false; } };
  $("iaLog").appendChild(box); $("iaLog").scrollTop = $("iaLog").scrollHeight;
}
function iaSend(texto) {
  texto = String(texto || "").trim(); if (!texto) return; iaBubble("out", esc(texto)); $("iaText").value = "";
  const t = nrm(texto), o = buscarRef(texto), now = new Date();
  const has = (...w) => w.some((x) => t.includes(x));
  // Acciones sobre un pedido concreto
  if (o && has("escribe", "manda", "envia mensaje", "enviale", "dile", "mensaje a")) {
    const msg = texto.split(/:\s*/).slice(1).join(": ").trim() || texto.replace(/^.*?ch[-\s]?\d{4}\s*/i, "").trim();
    if (!msg) return iaBubble("in", `¿Qué le escribo a ${esc(o.cliente_nombre)}? Usa: <b>escribe a ${o.ref}: tu mensaje</b>`);
    return propuesta(`Enviar a ${esc(o.cliente_nombre)} (${o.ref}) por WhatsApp:<br>«${esc(msg)}»`, () => api("enviar_mensaje", { order_id: o.id, texto: msg }), "Mensaje en cola de envío");
  }
  if (o && has("confirma") && has("pago", "bizum", "pagado")) {
    if (o.pago === "pagado") return iaBubble("in", `${o.ref} ya está pagado.`);
    return propuesta(`¿Has comprobado en tu banco un Bizum de <b>${eur(o.importe_cents)}</b> con el concepto <b>${o.ref}</b>? Se marcará como pagado y se avisará a ${esc(o.cliente_nombre)}.`, () => api("confirmar_pago", { order_id: o.id }), `Pago de ${o.ref} confirmado`);
  }
  if (o && has("rechaza")) {
    const motivo = texto.replace(/^.*?ch[-\s]?\d{4}\s*[:,-]?\s*/i, "").replace(/^(por|porque)\s+/i, "").trim();
    if (!motivo) return iaBubble("in", `Dime el motivo: <b>rechaza ${o.ref} sin stock de ese color</b>`);
    return propuesta(`Rechazar ${o.ref} de ${esc(o.cliente_nombre)}. Motivo: «${esc(motivo)}». Se le avisará por WhatsApp.`, () => api("rechazar", { order_id: o.id, motivo }), `${o.ref} rechazado`);
  }
  if (o && has("acepta")) return propuesta(`Aceptar ${o.ref} de ${esc(o.cliente_nombre)} y avisarle (aceptar no confirma el pago).`, () => api("aceptar", { order_id: o.id }), `${o.ref} aceptado`);
  const est = has("cancela") ? "cancelado" : has("preparacion", "fabricando") ? "en_preparacion" : has("enviado", "en camino") ? "enviado" : has("completado", "entregado") ? "completado" : null;
  if (o && est) { const motivo = est === "cancelado" ? texto.replace(/^.*?ch[-\s]?\d{4}\s*[:,-]?\s*/i, "").trim() : "";
    return propuesta(`Pasar ${o.ref} de ${esc(o.cliente_nombre)} a «${EST[est]}» y avisarle por WhatsApp.${motivo ? " Motivo: «" + esc(motivo) + "»" : ""}`, () => api("cambiar_estado", { order_id: o.id, estado: est, motivo: motivo || undefined }), `${o.ref} → ${EST[est]}`); }
  if (o) { iaList(`Pedido ${o.ref}`, [o]); return; }
  // Consultas
  if (has("ayuda", "que puedes", "comandos", "como funciona")) return iaBubble("in", AYUDA);
  if (has("sin leer", "mensajes")) { const cs = convList().filter((c) => c.unread); return iaBubble("in", cs.length ? `<b>Conversaciones con mensajes sin leer</b><br>${cs.map((c) => `• ${esc(c.nombre)} (${c.unread}): ${esc(c.last.texto.slice(0, 80))}`).join("<br>")}` : "No tienes mensajes sin leer."); }
  if (has("pendiente") && has("pago", "cobr", "bizum")) return iaList("Pendientes de pago", ORDERS.filter((o) => o.pago !== "pagado" && activo(o)));
  if (has("nuev")) return iaList("Reservas nuevas", ORDERS.filter((o) => o.estado === "nueva_reserva"));
  if (has("revis")) return iaList("Pendientes de revisar", ORDERS.filter((o) => o.estado === "pendiente_revision"));
  if (has("preparacion", "fabricar")) return iaList("En preparación", ORDERS.filter((o) => o.estado === "en_preparacion"));
  if (has("enviad")) return iaList("Enviados", ORDERS.filter((o) => o.estado === "enviado"));
  if (has("pagad", "cobrad")) return iaList("Pagados", ORDERS.filter((o) => o.pago === "pagado"));
  if (has("incidencia")) return iaList("Incidencias", ORDERS.filter((o) => o.estado === "incidencia"));
  if (has("hoy")) return resumen(new Date(now.getFullYear(), now.getMonth(), now.getDate()), "Hoy");
  if (has("ayer")) { const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1); const l = ORDERS.filter((o) => { const c = new Date(o.created_at); return c >= d && c < new Date(d.getTime() + 864e5); }); return iaList("Reservas de ayer", l); }
  if (has("semana")) { const d = new Date(now); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return resumen(d, "Esta semana (desde el lunes)"); }
  if (has("mes")) return resumen(new Date(now.getFullYear(), now.getMonth(), 1), "Este mes");
  if (has("resumen", "como va", "estadistica", "total", "ventas", "ingres", "cuant")) return resumen(null, "Desde el principio");
  if (has("ultim")) return iaList("Últimas reservas", ORDERS.slice(0, 10));
  // Búsqueda por nombre, mascota o teléfono
  const q = t.replace(/^(busca|buscar|encuentra|el pedido de|pedido de|pedidos de|de)\s+/g, "").replace(/^(el pedido de|pedido de|de)\s+/, "").trim(), qd = q.replace(/\D/g, "");
  const hits = q.length >= 2 ? ORDERS.filter((o) => [o.cliente_nombre, o.perro, o.ref].some((v) => nrm(v).includes(q)) || (qd.length >= 3 && String(o.cliente_telefono).includes(qd))) : [];
  if (hits.length) return iaList(`Resultados para «${q}»`, hits);
  iaBubble("in", `No he encontrado nada para «${esc(texto)}».<br><br>` + AYUDA);
}
$("iaForm").addEventListener("submit", (e) => { e.preventDefault(); iaSend($("iaText").value); });
$("iaSug").innerHTML = ["Pendientes de pago", "Resumen de esta semana", "Reservas nuevas", "Ayuda"].map((x) => `<button type="button">${x}</button>`).join("");
$("iaSug").querySelectorAll("button").forEach((b) => b.onclick = () => iaSend(b.textContent));
$("iaText").placeholder = "Ej.: pendientes de pago, busca Toby, confirma pago CH-1234";
for (const id of ["iaText", "chText"]) $(id).addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && window.matchMedia("(pointer:fine)").matches) { e.preventDefault(); $(id).form.requestSubmit(); } });

// ---------- Ajustes ----------
async function renderSettings() {
  $("settings").innerHTML = `<div class="setrow"><div><b>Cuenta</b><div class="muted small">${esc(ADMIN)}</div></div><button class="btn ghost" type="button" id="sOut">Cerrar sesión</button></div><div class="setrow muted">Comprobando conexiones…</div>`;
  $("sOut").onclick = async () => { await sb.auth.signOut(); location.reload(); };
  let c = null; try { c = await api("config"); } catch (e) { $("settings").lastElementChild.textContent = "No se pudo leer la configuración: " + e.message; return; }
  const st = (ok) => `<span class="badge ${ok ? "ok" : "pago"}">${ok ? "Conectado" : "Falta configurar"}</span>`;
  const notifOk = "Notification" in window && Notification.permission === "granted";
  $("settings").innerHTML = `
    <div class="setrow"><div><b>Cuenta</b><div class="muted small">${esc(ADMIN)}</div></div><button class="btn ghost" type="button" id="sOut">Cerrar sesión</button></div>
    <div class="setrow"><div><b>WhatsApp Business</b><div class="muted small">Envío y recepción de mensajes</div></div>${st(c.whatsapp && c.firma_whatsapp)}</div>
    <div class="setrow"><div style="min-width:0"><b>Webhook para Meta</b><div class="muted small">URL de devolución de llamada</div><code>${esc(c.webhook_url)}</code><div class="muted small" style="margin-top:6px">Identificador de verificación</div><code>${esc(c.verify_token)}</code></div></div>
    <div class="setrow"><div><b>Asistente</b><div class="muted small">Funciona solo, sin IA de pago ni créditos</div></div>${st(true)}</div>
    <div class="setrow"><div><b>Gmail de la tienda</b><div class="muted small">${c.gmail ? esc(c.gmail) + " · avisos al cliente y copia de cada aviso para ti" : "Correos automáticos a clientes y avisos para ti"}</div></div>${st(c.email)}</div>
    <div class="setrow"><div><b>Avisos en este dispositivo</b><div class="muted small">Con la app abierta o en segundo plano</div></div>${notifOk ? st(true) : `<button class="btn ghost" type="button" id="sNotif">Activar avisos</button>`}</div>
    <div class="setrow"><div><b>Bizum</b><div class="muted small">Número que ve el cliente</div></div><code>${esc(c.bizum)}</code></div>`;
  $("sOut").onclick = async () => { await sb.auth.signOut(); location.reload(); };
  if ($("sNotif")) $("sNotif").onclick = async () => { const p = await Notification.requestPermission(); toast(p === "granted" ? "Avisos activados" : "No se activaron los avisos"); renderSettings(); };
}

// ---------- tiempo real + avisos ----------
function realtime() {
  sb.channel("chapita-admin")
    .on("postgres_changes", { event: "*", schema: "public", table: "orders" }, () => loadAll())
    .on("postgres_changes", { event: "*", schema: "public", table: "messages" }, () => loadAll())
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "notificaciones" }, (p) => {
      loadAll();
      const t = p.new?.texto || "Nuevo aviso";
      if ("Notification" in window && Notification.permission === "granted") navigator.serviceWorker?.ready.then((r) => r.showNotification("Chapita", { body: t, icon: "/admin/icon-192.png", tag: "chapita-" + p.new?.id })).catch(() => {});
      toast(t);
    }).subscribe();
}
$("btnRefresh").onclick = () => loadAll().then(() => toast("Actualizado")).catch((e) => toast(e.message));
$("btnReadNotif").onclick = async () => { try { await api("marcar_notificaciones"); await loadAll(); } catch (e) { toast(e.message); } };

// ---------- acceso ----------
async function entrar(session) {
  if (!session) { $("vApp").hidden = true; $("vLogin").hidden = false; return; }
  const { data: isAdmin, error } = await sb.rpc("is_admin");
  if (error || !isAdmin) { await sb.auth.signOut(); $("lErr").textContent = "Esta cuenta no tiene acceso a Chapita Admin."; $("vApp").hidden = true; $("vLogin").hidden = false; return; }
  ADMIN = session.user.email; $("whoSide").textContent = ADMIN;
  $("vLogin").hidden = true; $("vApp").hidden = false; buildNav();
  let t = "Inicio"; try { t = localStorage.getItem("chapita-tab") || "Inicio"; } catch {}
  go(TITLES[t] ? t : "Inicio");
  try { await loadAll(); } catch (e) { toast("No se pudieron cargar los datos: " + e.message); }
  realtime();
}
$("fLogin").addEventListener("submit", async (e) => {
  e.preventDefault(); $("lErr").textContent = ""; $("lBtn").disabled = true;
  const { data, error } = await sb.auth.signInWithPassword({ email: $("lEmail").value.trim(), password: $("lPass").value });
  $("lBtn").disabled = false;
  if (error) { $("lErr").textContent = /confirm/i.test(error.message) ? "Confirma primero tu correo con el enlace que te enviamos." : "Correo o contraseña incorrectos."; return; }
  entrar(data.session);
});
$("lSignup").onclick = async () => {
  const email = $("lEmail").value.trim(), password = $("lPass").value;
  if (!email || password.length < 10) { $("lErr").textContent = "Escribe tu correo y una contraseña de al menos 10 caracteres."; return; }
  const { error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + "/admin/" } });
  $("lErr").textContent = error ? "No se pudo crear la cuenta: " + error.message : "Cuenta creada. Abre el correo que te hemos enviado para confirmarla y después entra aquí.";
};
sb.auth.getSession().then(({ data }) => entrar(data.session));
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/admin/sw.js").catch(() => {});
</script>
